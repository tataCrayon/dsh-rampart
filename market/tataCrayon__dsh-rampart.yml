# 市场条目：提到 awesome-dsh-plugin/awesome-dsh-plugin
#
# 这**不是**本插件的配置文件，是投稿文件的存底。提交时把它复制到那个仓库的
# `data/plugins/tataCrayon__dsh-rampart.yml`，一个文件就是全部投稿。
#
# 已核对 contributing.md（2026-10-31）：
#   - 只有 description.en 是必填；zh 可选，缺了维护者会补
#   - category 必须在允许集合内（这里是 dev，与 dsh-memory-guard /
#     dsh-memory-watchdog / dsh-concurrency-guard 同类）
#   - 描述含 ": " 必须加引号，否则 YAML 解析成嵌套键
#   - icon 必须是 GitHub 托管的位图（png/jpg/jpeg/webp），SVG 和第三方图床会被拒
#   - 仓库需创建满 1 天（2026-10-31 07:32:50Z 建，已于 11-01 15:32 满足）
#
# tarball 是**必需的，不是锦上添花**：npm 把 `github:owner/repo` 解析成
# `ssh://git@github.com/...`（本仓 GIT_TRACE 实测），没配 SSH 密钥的人会
# `Permission denied (publickey)`。给 Release 托管的预构建包，装的人才不卡在这。
# 资产名刻意不带版本号，配合钉住的 tag —— contributing.md 点名的两种不腐烂写法之一。
#
# ⚠️ 描述里的措辞是被逐字对着代码核的。所以这里写「内存」分级、「CPU 占比只显示不参与
# 判定」—— 因为 `gradeOf` 只读 warnFreeMemoryMb / criticalFreeMemoryMb / warnCommitMb /
# criticalCommitMb 四个内存阈值，CPU 全仓没有任何阈值配置。写成「按内存/CPU 压力分级」
# 会被打回：那是夸大。
url: https://github.com/tataCrayon/dsh-rampart
name: tataCrayon/dsh-rampart
category: dev
tarball: https://github.com/tataCrayon/dsh-rampart/releases/download/v0.2.0/dsh-rampart.tgz
description:
  en: 'Grades free physical and commit memory and refuses heavy tools (shell, workflow, subagent) before the machine thrashes. Also shows in the composer how much of the machine dsh itself is using, including whole-machine CPU.'
  zh: '按可用物理内存与提交内存分级，到线就拦重活（shell、workflow、subagent）。并在输入框旁显示 DSH 自己占用了整机多少资源，含整机 CPU 占比。'
icon: https://raw.githubusercontent.com/tataCrayon/dsh-rampart/master/assets/icon-180.png
