name: Publish to npm

# 为什么不在本机 `npm publish`：
#
# 开发机的网络必须经过 VPN 才能访问 npm，而 VPN 是共享出口 IP，`registry.npmjs.org`
# 直连超时、`www.npmjs.com` 会被 Cloudflare 挑战页挡住（IP 被判成机器人）。这不是
# 配置问题，换 node、换 registry 都治不了。
#
# GitHub Actions 的 runner 跑在微软云上，出口 IP 干净，不经过任何 VPN、不需要代理，
# 也不需要 `npm login` 的浏览器环节。所以发布搬到这边来。
#
# 触发方式只有两个，**push 到 master 不会自动发**——发布是对外不可撤销的动作，
# 值得多一道人工确认。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不真发（npm publish --dry-run）'
        type: boolean
        default: true

permissions:
  contents: read
  # provenance 需要它：让 npm 生成一份「这个包确实由这个仓库的这次提交构建」的可验证证明。
  id-token: write

jobs:
  publish:
    # 必须是 Windows。插件的能力层依赖 Win32 API：`loadWin32()` 在非 win32 平台直接返回
    # `{ available: false }`，于是 scripts/soak.mjs 里的整树采样断言（要求进程数 ≥ 1）
    # 在 ubuntu runner 上必然失败。换成 Linux 不是「省点钱」，是「测不到真东西」。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # 刻意没有 `npm install`：package.json 里 dependencies 和 devDependencies 都是空的，
      # 装了也只是凭空生成一个 lockfile、多一次网络往返、多一条供应链面。
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            const isTag = process.env.GITHUB_REF_TYPE === "tag";
            const ref = process.env.GITHUB_REF_NAME || "";
            if (isTag && ref !== "v" + pkg.version) {
              console.error("tag " + ref + " 与 package.json 的 " + pkg.version + " 不匹配，拒绝发布");
              process.exit(1);
            }
            console.log("将发布 " + pkg.name + "@" + pkg.version + (isTag ? "（tag " + ref + "）" : "（手动触发）"));
          '

      - name: Build client bundle
        run: npm run build:client

      # 集成测试要真跑，就得有宿主依赖。这几个包由 DSH 本体提供，本仓库刻意**不声明**
      # 它们 —— 声明等于把 DSH 的版本钉死在插件里，插件就只认那一版宿主了。所以只在
      # CI 里临时装，`--no-save` 不写进 package.json、不生成 lockfile。
      #
      # 版本精确钉到本机 DSH 0.2.1-rc.2 内部实际带的版本，不是 @latest：
      # dsh-tools / dsh-system-prompt 的 dist-tags.latest 停在 0.0.1-rc.1，装 @latest
      # 会拿到 API 不兼容的老版本，集成测试会以「查不到某个导出」的方式失败 ——
      # 看起来像插件坏了，其实是装错了宿主。所以写死。
      #
      # dsh-win32-process 是给 soak 用的：没有它，整树采样那几条断言无从谈起。
      # 它自己会带 koffi，而 koffi 的原生二进制由 optionalDependency
      # `@koromix/koffi-win32-x64` 提供 —— 是预编译产物，**不需要** install script
      # 现场编译，所以 runner 上不会因为缺 MSVC 而失败。
      - name: Install host deps for integration tests
        run: >-
          npm install --no-save --no-audit --no-fund
          @deepseek-ai/cordis@4.0.5
          @deepseek-ai/dsh-tools@0.2.1-rc.2
          @deepseek-ai/dsh-system-prompt@0.2.1-rc.2
          @deepseek-ai/dsh-win32-process@0.2.1-rc.2

      - name: Unit tests
        run: npm test

      - name: Soak probe
        run: npm run soak

      # 为什么这里存的是账号密码而不是 token：
      # 开发机连不上 registry.npmjs.org（Cloudflare 的 104.16.x 整段在本地被断，
      # TCP 层就超时），所以拿不到 token。而 runner 的网络是通的 —— 于是把凭据
      # 交给 runner，由它在干净网络上换成 token，token 不离开这个 job。
      #
      # 换来的 token 只写进 GITHUB_ENV 的 NODE_AUTH_TOKEN，不打印、不落 artifact。
      - name: Mint npm token from credentials
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          NPM_USER: ${{ secrets.NPM_USER }}
          NPM_PASS: ${{ secrets.NPM_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_USER:-}" ] || [ -z "${NPM_PASS:-}" ]; then
            echo "::error::没有 NPM_USER / NPM_PASS secret，无法登录。"
            exit 1
          fi
          # 只打印长度，不打印值 —— 用来确认 secret 真的传过来了、没被截断或加尾巴。
          # 密码是 libsodium sealed box 加密后写进 secret 的，这一步顺便验证那条链路没出错。
          echo "凭据长度：user=${#NPM_USER} pass=${#NPM_PASS}"
          # legacy 登录打的是 registry 的 /-/user/org.couchdb.user:<name>，
          # 不需要 www.npmjs.com、不需要浏览器、不需要邮箱验证码。
          # 响应里只有 token 和 ok，密码不会回显。
          #
          # 刻意**不用** `--fail-with-body`：401 时我们正需要读 body 里的 error 字段，
          # 才能区分「密码错」「账号不存在」「要 2FA」。curl 一 fail 就把 body 丢了。
          body=$(printf '{"name":"%s","password":"%s"}' "$NPM_USER" "$NPM_PASS")
          resp=$(curl -sS --max-time 60 \
                 -X PUT "https://registry.npmjs.org/-/user/org.couchdb.user:${NPM_USER}" \
                 -H 'content-type: application/json' -d "$body")
          token=$(printf '%s' "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j.token??"")}catch{process.stdout.write("")}})')
          if [ -z "$token" ]; then
            # 只打印 error 字段，绝不打印 resp 全文（避免把凭据写进日志）
            err=$(printf '%s' "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.error??j.code??"unknown"))}catch{process.stdout.write("non-json")}})')
            echo "::error::登录失败，error=${err}"
            case "$err" in
              *otp*|*one-time*) echo "→ 该账号开了 2FA，需要认证器 App 的 6 位码，不是邮箱验证码。" ;;
              *invalid*)        echo "→ 用户名或密码不对（也可能是账号不存在）。" ;;
              *)                echo "→ 未识别的错误，见上面的 error 字段。" ;;
            esac
            exit 1
          fi
          echo "::add-mask::$token"
          echo "NODE_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          echo "已取得 npm token（长度 ${#token}），已登记为 mask。"

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TOKEN_FROM_CREDS: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          # `--ignore-scripts` 是有意为之：prepublishOnly 里的 build/test/soak 上面三步
          # 已经分别跑过了。跑两遍不但慢，还会让失败日志分不清是哪一步挂的。
          if [ "${TOKEN_FROM_CREDS}" != "true" ]; then
            npm publish --dry-run --access public --ignore-scripts
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::没有可用的 npm token（NPM_TOKEN secret 或刚换到的都为空）。"
            exit 1
          fi
          npm publish --access public --provenance --ignore-scripts
